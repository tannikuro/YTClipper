name: Clip

on:
  workflow_dispatch:
      inputs:
        video_url:
          description: "Video url:"
          required: true
        start_time:
          description: "Clip start time:(hh:mm:ss)"
          required: true
        end_time:
          description: "Clip end time:"
          required: true

permissions:
  contents: read

jobs:
  clip:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp
        sudo apt update && sudo apt install ffmpeg -y
        mkdir -p output

    - name: Get Clip
      run: |
        python3 ./main.py --url "${{ github.event.inputs.video_url }}" --start ${{ github.event.inputs.start_time }} --end ${{ github.event.inputs.end_time }}
      # Make sure the clip is saved in the output directory
      # Assuming main.py writes the output file as "clip.mp4" in the "output" directory.
      # You can use a different name based on your script.

    - name: List output files (debugging step)
      run: ls -la output/

    - uses: actions/upload-artifact@v3
      with:
        name: clip-output
        path: output/
